<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jellyfin Quick Connect</title>
  <style nonce="__CSP_NONCE__">
  body { font-family: system-ui, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--background, #101010); color: var(--text, #fff); }
  .card { padding: 2rem; border-radius: 12px; background: var(--card, #1e1e1e); max-width: 420px; width: 100%; }
  input { width: 100%; padding: .75rem; font-size: 1.25rem; letter-spacing: .35em; text-align: center; border-radius: 8px; border: 1px solid #444; background: #111; color: #fff; }
  button { width: 100%; margin-top: 1rem; padding: .75rem; border: 0; border-radius: 8px; background: var(--accent, #00a4dc); color: #fff; font-weight: 600; cursor: pointer; }
  .msg { margin-top: 1rem; min-height: 1.25rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Authorize device</h1>
    <p>Enter the 6-digit Quick Connect code shown in your Jellyfin app.</p>
    <input id="code" maxlength="8" inputmode="numeric" autocomplete="one-time-code" placeholder="000000" />
    <button type="button" id="submit">Authorize</button>
    <p class="msg" id="msg"></p>
  </div>
  <script type="application/json" id="jelly-oidc-data">__DATA_JSON__</script>
  <script nonce="__CSP_NONCE__">
    (function () {
      const data = JSON.parse(document.getElementById('jelly-oidc-data').textContent);
      const code = document.getElementById('code');
      const msg = document.getElementById('msg');
      document.getElementById('submit').onclick = async function () {
        msg.textContent = 'Authorizing…';
        try {
          const res = await fetch('/JellyOidc/OIDC/QuickConnect/Authorize', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: data.token, code: code.value.trim() })
          });
          const body = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(body.title || body.message || res.statusText);
          msg.textContent = 'Device authorized. You can return to your app.';
        } catch (e) {
          msg.textContent = e.message || String(e);
        }
      };
    })();
  </script>
</body>
</html>
